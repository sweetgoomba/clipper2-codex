[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.workspace]
members = [
    "clipper_plugin_sdk",
    "clipper_face_core",
    "plugins/dialog_highlight",
    "plugins/dance_highlight",
    "plugins/clipper_video_render",
    "plugins/tts_supertonic",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "tests/fixtures", "**/golden"]

[tool.ruff.lint]
# 초기 = "show-stopper"만(미정의 이름·문법오류). 거짓양성 거의 0. 룰셋 상향은 후속(spec §6 TBD).
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
exclude = ['\.venv', 'tests/fixtures']

[tool.pytest.ini_options]
addopts = "-ra"
