[project]
name = "clipper-plugin-dance-highlight"
version = "0.1.0"
description = "안무 영상 하이라이트 추출 플러그인"
requires-python = ">=3.11,<3.12"
dependencies = [
    "clipper-plugin-sdk",
    "clipper-face-core",
    "ultralytics>=8.0",
    "opencv-python>=4.10",
    "onnxruntime==1.31.0; sys_platform != 'win32'",
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    "onnx==1.20.1",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "yt-dlp>=2025.12.8",
]

[tool.uv.sources]
clipper-plugin-sdk = { workspace = true }
clipper-face-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["dance_highlight"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
